name:

image:
  name:
  tag:

nodeSelector:
  tier:

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

configmap:
  enabled: false

secret:
  enabled: false

podAnnotations: []

# หน่วงก่อนส่ง SIGKILL — 30 คือค่าเดียวกับ default ของ k8s (ไม่เปลี่ยนพฤติกรรมเดิม)
terminationGracePeriodSeconds: 30

# opt-in ต่อ service เช่น
#   lifecycle:
#     preStop:
#       exec:
#         command: ["/bin/sh", "-c", "sleep 10"]
lifecycle: {}

tolerations: []

affinity: {}

ingress:
  enabled: false
  class: alb
  albName:
  hosts: []
  # scheme ต้องตรงกับ IngressGroup ที่ albName ชี้ ไม่งั้น ALB controller จะขึ้น
  # FailedBuildModel แล้วบล็อก reconcile ของทั้งกลุ่ม
  # ตั้งที่นี่เท่านั้น ห้ามใส่ใน annotations ข้างล่าง (จะกลายเป็น duplicate key
  # ซึ่ง kustomize v4.5.7 ของ ArgoCD 2.6.2 เลือกตัวแรก = ค่า default ชนะ)
  scheme: internal
  targetType: ip
  # annotation เพิ่มเติม สำหรับคีย์ที่ไม่มีข้างบน เช่น
  #   annotations:
  #     alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:...
  #     alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
  #     alb.ingress.kubernetes.io/ssl-redirect: "443"
  #     alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=15
  annotations: {}

hpa:
  minReplicas: 2
  maxReplicas: 20

containerPort: 3000

healthCheck: /api/stat

healthCheckTimeout: 10